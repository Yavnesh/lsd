name: CI & Quality Gate

on:
  push:
    branches: [ "master", "main", "develop" ]
  pull_request:
    branches: [ "master", "main", "develop" ]

jobs:
  build-and-test:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Prisma Generate
      run: npx prisma generate
      
    - name: Run ESLint
      run: npm run lint
      
    - name: Run Tests
      run: npm test
      
    - name: Validate Production Build
      run: npm run build
      env:
        NEXTAUTH_SECRET: "mock-secret-for-ci-build-validation"
        NEXTAUTH_URL: "https://www.learnsomethingdaily.com"
